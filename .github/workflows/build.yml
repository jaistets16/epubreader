name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unpack project
        run: unzip -o project.zip
      - name: Download sherpa-onnx AAR
        run: |
          mkdir -p app/libs
          URL=$(curl -s "https://api.github.com/repos/k2-fsa/sherpa-onnx/releases?per_page=15" | grep -o 'https://[^"]*/sherpa-onnx-[0-9.]*\.aar' | head -1)
          echo "Using $URL"
          test -n "$URL"
          curl -L --fail -o app/libs/sherpa-onnx.aar "$URL"
      - name: Build
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: EpubReader-apk
          path: app/build/outputs/apk/debug/app-debug.apk
