          cat > 'app/src/main/java/com/example/epubreader/KeepAliveService.kt' <<'EOF_FILE'
          package com.example.epubreader

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager

          /** Keeps the process alive while reading with the screen off. */
          class KeepAliveService : Service() {
              private var wl: PowerManager.WakeLock? = null
              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val nm = getSystemService(NotificationManager::class.java)
                  if (Build.VERSION.SDK_INT >= 26)
                      nm.createNotificationChannel(NotificationChannel("read", "Reading", NotificationManager.IMPORTANCE_LOW))
                  val pi = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE)
                  val n = Notification.Builder(this, "read")
                      .setContentTitle("Reading aloud").setContentIntent(pi)
                      .setSmallIcon(android.R.drawable.ic_media_play).build()
                  if (Build.VERSION.SDK_INT >= 29)
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK)
                  else startForeground(1, n)
                  wl = (getSystemService(Context.POWER_SERVICE) as PowerManager)
                      .newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "epubreader:tts").apply { acquire(6 * 60 * 60 * 1000L) }
                  return START_NOT_STICKY
              }

              override fun onDestroy() { wl?.let { if (it.isHeld) it.release() }; super.onDestroy() }
          }
